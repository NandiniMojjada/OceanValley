<section id="process" class="py-16 sm:py-24 lg:py-32 bg-forest-deep text-cream">
  <div class="max-w-7xl mx-auto px-4 sm:px-6">
    <div class="text-center max-w-2xl mx-auto mb-10 sm:mb-16">
      <p class="text-[10px] sm:text-xs tracking-[0.3em] sm:tracking-[0.4em] uppercase text-gold mb-3 sm:mb-4">Our Process</p>
      <h2 class="font-display text-3xl sm:text-4xl lg:text-5xl">From first conversation to lasting landscape.</h2>
    </div>
    <div class="relative">
      <div class="hidden lg:block absolute top-8 left-0 right-0 h-px bg-gradient-to-r from-transparent via-gold/40 to-transparent"></div>
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4 sm:gap-6 lg:gap-8">
        @for (step of steps; track step.label; let i = $index) {
          <div class="relative text-center p-2">
            <div class="relative mx-auto w-12 h-12 sm:w-16 sm:h-16 rounded-full glass-dark flex items-center justify-center mb-3 sm:mb-5">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 sm:w-6 sm:h-6 text-gold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path [attr.d]="step.svgPath"/>
              </svg>
            </div>
            <div class="font-display text-[10px] sm:text-xs tracking-[0.2em] sm:tracking-[0.3em] text-gold mb-1 sm:mb-2">0{{ i + 1 }}</div>
            <h3 class="font-display text-base sm:text-lg leading-snug">{{ step.label }}</h3>
          </div>
        }
      </div>
    </div>
  </div>
</section>
