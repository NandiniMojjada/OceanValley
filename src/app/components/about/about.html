<section id="about" class="py-16 sm:py-24 lg:py-32 bg-background relative overflow-hidden">
  <div class="max-w-7xl mx-auto px-4 sm:px-6">
    <div class="text-center max-w-3xl mx-auto mb-10 sm:mb-16">
      <p class="text-[10px] sm:text-xs tracking-[0.3em] sm:tracking-[0.4em] uppercase text-forest mb-3 sm:mb-4">About Ocean Valley</p>
      <h2 class="font-display text-3xl sm:text-4xl lg:text-5xl text-forest-deep">Crafting Dubai's Most Elegant & Luxury Outdoor Landscapes</h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 sm:gap-8">
      @for (block of blocks; track block.title; let i = $index) {
        <div class="group relative bg-cream/60 rounded-xl p-6 sm:p-8 border border-border/80 hover:border-forest/30 transition-all duration-500 hover:shadow-luxe hover:-translate-y-1 flex flex-col justify-between">
          <div class="absolute top-5 right-5 sm:top-6 sm:right-6 font-display text-3xl sm:text-4xl font-bold text-forest/10 group-hover:text-gold/30 transition-colors">
            0{{ i + 1 }}
          </div>
          <div>
            <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-forest/10 flex items-center justify-center mb-5 sm:mb-6 group-hover:bg-forest group-hover:text-cream transition-colors duration-300">
              @if (i === 0) {
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 sm:w-6 sm:h-6 text-forest group-hover:text-gold transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              } @else if (i === 1) {
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 sm:w-6 sm:h-6 text-forest group-hover:text-gold transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 sm:w-6 sm:h-6 text-forest group-hover:text-gold transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg>
              }
            </div>
            <h3 class="font-display text-xl sm:text-2xl text-forest-deep mb-3 sm:mb-4 group-hover:text-forest transition-colors">{{ block.title }}</h3>
            <p class="text-muted-foreground leading-relaxed text-sm sm:text-base">{{ block.desc }}</p>
          </div>
          <div class="mt-6 sm:mt-8 pt-4 border-t border-border/40 flex items-center justify-between">
            <span class="text-[10px] sm:text-xs font-semibold tracking-wider uppercase text-forest/70 group-hover:text-gold transition-colors">Excellence in UAE</span>
            <div class="w-2 h-2 rounded-full bg-gold opacity-0 group-hover:opacity-100 transition-opacity"></div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
